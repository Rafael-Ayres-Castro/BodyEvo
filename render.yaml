# Render (plano gratuito): a api/ do Rumo.
# Dashboard › New › Blueprint › escolha este repositório. Os segredos (sync: false)
# são pedidos no painel e nunca ficam no git.
services:
  - type: web
    name: rumo-api
    runtime: python
    plan: free
    rootDir: api
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: RUMO_USER_ID
        sync: false
      - key: GARMIN_API_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        sync: false
      - key: INTERNAL_TOKEN
        sync: false
      - key: ALLOWED_ORIGINS
        value: https://rafael-ayres-castro.github.io
