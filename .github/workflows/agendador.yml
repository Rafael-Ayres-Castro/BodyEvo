# Chama a api/ nos horários: sincroniza o Garmin a cada 30 min e envia as notificações.
# O cron do GitHub Actions roda em UTC e pode atrasar alguns minutos.
# São Paulo = UTC−3 (sem horário de verão), então 06:00–23:59 em SP = 09:00–02:59 UTC.
# As rotas são idempotentes: rodar duas vezes não duplica dados nem notificação.
#
# Segredos do repositório (Settings › Secrets and variables › Actions):
#   RUMO_API_URL         ex.: https://rumo-api.onrender.com
#   RUMO_INTERNAL_TOKEN  o mesmo INTERNAL_TOKEN da api/

name: Agendador

on:
  schedule:
    - cron: '*/30 9-23 * * *'   # 06:00 às 20:30 em São Paulo
    - cron: '*/30 0-2 * * *'    # 21:00 às 23:30 em São Paulo
  workflow_dispatch:

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      API: ${{ secrets.RUMO_API_URL }}
      TOKEN: ${{ secrets.RUMO_INTERNAL_TOKEN }}
    steps:
      # A hospedagem gratuita desliga a API parada; o primeiro pedido pode levar ~1 min.
      - name: Acordar a API
        run: curl -sS --retry 4 --retry-delay 15 --retry-all-errors --max-time 90 "$API/health"

      - name: Garmin
        run: curl -fsS --retry 2 --retry-delay 20 --max-time 120 -X POST -H "Authorization: Bearer $TOKEN" "$API/internal/garmin/sync"

      - name: Notificações
        if: always()
        run: curl -fsS --retry 2 --retry-delay 20 --max-time 120 -X POST -H "Authorization: Bearer $TOKEN" "$API/internal/push/pendentes"
