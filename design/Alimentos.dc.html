<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Meus alimentos</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@200..800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#E9E5F2}
.app,.app *{box-sizing:border-box}
.app{font-family:'Plus Jakarta Sans',-apple-system,system-ui,sans-serif;color:#17141F;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
.app a,.app button{-webkit-tap-highlight-color:transparent;touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;font:inherit}
.app input{font-family:inherit;-webkit-tap-highlight-color:transparent}
.app input::placeholder{color:#8A8496}
.app input:focus-visible{outline:none}
.app button:focus-visible,.app a:focus-visible{outline:2px solid #7C4DEB;outline-offset:2px}
.field:focus-within{box-shadow:0 0 0 2px #7C4DEB}
.num{font-variant-numeric:tabular-nums}
.press{transition:transform 140ms cubic-bezier(0.23,1,0.32,1),color 180ms ease}
.press:active{transform:scale(0.97)}
.seg-ind{transition:transform 300ms cubic-bezier(0.32,0.72,0,1)}
.row{transition:background-color 120ms ease}
.row:active{background:#F3F0F8}
.lrow+.lrow{border-top:1px solid #F0EDF5}
.rise{animation:rise 460ms cubic-bezier(0.23,1,0.32,1) backwards}
@keyframes rise{from{opacity:0;transform:translateY(10px)}}
@keyframes fade{from{opacity:0}}
@media (hover:hover) and (pointer:fine){.row:hover{background:#F7F5FB}}
@media (prefers-reduced-motion:reduce){.rise{animation-name:fade}.seg-ind{transition:none}.press:active{transform:none}}
/* Polimento: tokens de movimento e toque */
.app{--ease-out:cubic-bezier(0.23,1,0.32,1);--ease-in-out:cubic-bezier(0.77,0,0.175,1);--ease-drawer:cubic-bezier(0.32,0.72,0,1);font-optical-sizing:auto}
.app p{text-wrap:pretty}
.app h1,.app h2{text-wrap:balance}
.app [style*="font-size: 11px"],.app [style*="font-size: 12px"]{letter-spacing:0.01em}
.app input::placeholder{color:#6F6982}
.press{transition:transform 160ms var(--ease-out),background-color 200ms ease,color 200ms ease,box-shadow 200ms ease,opacity 200ms ease}
.hit{position:relative}
.hit::after{content:"";position:absolute;inset:-8px -4px}
.rise{animation:none}
</style>
</helmet>
<div class="app" style="width: 390px; height: 1320px; position: relative; overflow: hidden; background: #F4F2F9">
<div aria-hidden="true" style="position: absolute; left: 0; top: 0; width: 390px; height: 300px; background: radial-gradient(120% 85% at 25% 0%, #D9C8FB 0%, rgba(217,200,251,0.45) 45%, rgba(244,242,249,0) 100%)"></div>

<main style="position: relative; padding: 58px 20px 40px; display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; align-items: center; justify-content: space-between">
<a href="Main.dc.html" class="press" aria-label="Voltar" style="width: 44px; height: 44px; border-radius: 22px; background: rgba(255,255,255,0.7); color: #17141F; display: flex; align-items: center; justify-content: center; text-decoration: none"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 5-7 7 7 7"></path></svg></a>
<a href="NovoAlimento.dc.html" class="press" style="height: 44px; padding: 0 16px 0 12px; border-radius: 22px; background: #17141F; color: #FFFFFF; display: flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 700; text-decoration: none"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>Novo alimento</a>
</div>

<header style="display: flex; flex-direction: column; gap: 4px; padding: 4px 4px 0">
<p class="num" style="margin: 0; font-size: 14px; font-weight: 600; color: #5E5870">{{ countText }}</p>
<h1 style="margin: 0; font-size: 28px; line-height: 1.1; font-weight: 750; letter-spacing: -0.028em">Meus alimentos</h1>
</header>

<label class="field" style="display: flex; align-items: center; gap: 10px; height: 48px; padding: 0 14px; border-radius: 16px; background: #FFFFFF">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5E5870" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"></circle><path d="m16 16 4 4"></path></svg>
<span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%)">Buscar alimento</span>
<input type="search" enterkeyhint="search" autocomplete="off" autocorrect="off" placeholder="Buscar" value="{{ q }}" onChange="{{ onQ }}" style="flex: 1; min-width: 0; border: 0; background: transparent; padding: 0; font-size: 16px; font-weight: 550; color: #17141F">
</label>

<div role="group" aria-label="Ordenar" style="position: relative; display: flex; height: 40px; padding: 3px; border-radius: 14px; background: #E9E5F1">
<span class="seg-ind" aria-hidden="true" style="position: absolute; left: 3px; top: 3px; width: calc((100% - 6px) / 2); height: 34px; border-radius: 11px; background: #FFFFFF; box-shadow: 0 1px 2px rgba(23,20,31,0.08), 0 3px 8px rgba(23,20,31,0.06); transform: translateX({{ segX }})"></span>
<sc-for list="{{ sorts }}" as="o" hint-placeholder-count="2">
<button type="button" class="press" aria-pressed="{{ o.on }}" onClick="{{ o.pick }}" style="position: relative; flex: 1; border: 0; background: transparent; border-radius: 11px; font-size: 14px; font-weight: 700; cursor: pointer; color: {{ o.fg }}">{{ o.label }}</button>
</sc-for>
</div>

<section class="rise" aria-label="Lista de alimentos" style="background: #FFFFFF; border-radius: 24px; overflow: hidden; box-shadow: 0 1px 2px rgba(40,24,90,0.04), 0 12px 32px rgba(60,36,130,0.06)">
<sc-for list="{{ foods }}" as="f" hint-placeholder-count="12">
<a href="NovoAlimento.dc.html" class="row lrow" style="min-height: 58px; padding: 9px 12px 9px 16px; display: flex; align-items: center; gap: 10px; color: #17141F; text-decoration: none">
<span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 15px; font-weight: 700">{{ f.name }}</span>
<span class="num" style="font-size: 12px; font-weight: 600; color: #5E5870">{{ f.sub }}</span>
</span>
<span class="num" style="font-size: 15px; font-weight: 750">{{ f.kcal }} <span style="font-size: 11px; font-weight: 650; color: #5E5870">kcal</span></span>
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8A8496" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 5 7 7-7 7"></path></svg>
</a>
</sc-for>
<sc-if value="{{ empty }}" hint-placeholder-val="{{ false }}">
<div style="padding: 24px 16px; display: flex; flex-direction: column; align-items: center; gap: 10px">
<p style="margin: 0; font-size: 14px; font-weight: 600; color: #5E5870">Nenhum alimento com “{{ q }}”.</p>
<a href="NovoAlimento.dc.html" class="press" style="height: 40px; padding: 0 16px; border-radius: 20px; background: #EEE7FD; color: #4A2CA8; display: flex; align-items: center; font-size: 14px; font-weight: 700; text-decoration: none">Cadastrar “{{ q }}”</a>
</div>
</sc-if>
</section>
<p style="margin: 0; padding: 0 12px; text-align: center; font-size: 12px; line-height: 1.45; font-weight: 550; color: #5E5870">Valores por 100 g, como no rótulo. Itens com porção ou unidade (whey, ovo) também podem ser registrados por quantidade.</p>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1320}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { q: '', sort: 0 };
  }
  renderVals() {
    const s = this.state;
    const F = [
      ['Arroz branco cozido', 128, 2.5, 28.1, 0.2, 41, ''],
      ['Aveia em flocos', 394, 13.9, 66.6, 8.5, 35, ''],
      ['Azeite de oliva', 884, 0, 0, 100, 44, '1 colher = 8 g'],
      ['Banana prata', 98, 1.3, 26.0, 0.1, 52, ''],
      ['Batata-doce cozida', 77, 0.6, 18.4, 0.1, 22, ''],
      ['Brócolis cozido', 25, 2.1, 4.4, 0.5, 21, ''],
      ['Feijão carioca cozido', 76, 4.8, 13.6, 0.5, 30, ''],
      ['Iogurte natural', 51, 4.1, 1.9, 3.0, 15, '1 pote = 170 g'],
      ['Mel', 309, 0, 84.0, 0, 24, ''],
      ['Ovo inteiro cozido', 146, 13.3, 0.6, 9.5, 40, '1 un = 50 g'],
      ['Pão de forma integral', 253, 9.4, 49.9, 3.7, 31, '1 fatia = 25 g'],
      ['Pasta de amendoim', 588, 25.1, 20.0, 50.4, 20, ''],
      ['Patinho grelhado', 219, 35.9, 0, 7.3, 18, ''],
      ['Peito de frango grelhado', 159, 32.0, 0, 2.5, 38, ''],
      ['Queijo minas frescal', 264, 17.4, 3.2, 20.2, 19, ''],
      ['Whey protein', 400, 80, 8, 6, 39, '1 scoop = 30 g']
    ];
    const f1 = (n) => n.toLocaleString('pt-BR', { minimumFractionDigits: 0, maximumFractionDigits: 1 });
    const kc = (n) => Math.round(n).toLocaleString('pt-BR');
    const norm = (t) => String(t).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
    const q = norm(s.q.trim());
    let list = F.filter((d) => !q || norm(d[0]).indexOf(q) !== -1);
    if (s.sort === 1) list = list.slice().sort((a, b) => b[5] - a[5]);
    const foods = list.map((d) => ({
      name: d[0],
      kcal: kc(d[1]),
      sub: (d[6] ? d[6] + ' · ' : '') + 'P ' + f1(d[2]) + ' · C ' + f1(d[3]) + ' · G ' + f1(d[4]) + (s.sort === 1 ? ' · ' + d[5] + '×' : '')
    }));
    const labels = ['A–Z', 'Mais usados'];
    return {
      countText: F.length + ' alimentos · valores por 100 g',
      q: s.q,
      onQ: (e) => this.setState({ q: String(e.target.value).slice(0, 40) }),
      segX: (s.sort * 100) + '%',
      sorts: labels.map((label, i) => ({
        label,
        on: i === s.sort,
        fg: i === s.sort ? '#17141F' : '#5E5870',
        pick: () => this.setState({ sort: i })
      })),
      foods,
      empty: foods.length === 0
    };
  }
}
</script>
</body>
</html>
